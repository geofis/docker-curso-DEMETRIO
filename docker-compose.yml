services:

  python-cientifico:

    image: python-cientifico
    container_name: python-cientifico

    build: .

    container_name: python-cientifico

    stdin_open: true
    tty: true

    volumes:
      - ./datos:/datos
      - ./scripts:/trabajo/scripts
      - ./ejemplos:/trabajo/ejemplos

    working_dir: /trabajo
